<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Otimização de Rede Seguro: Resolução de DNS antecipada sem conexões ociosas -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
    <link rel="dns-prefetch" href="https://f.convertkit.com">
    <link rel="dns-prefetch" href="https://nutricao-com-marco.kit.com">
    <link rel="dns-prefetch" href="https://connect.facebook.net">

    <!-- 1. Pré-conexão com o servidor do Proxy de Imagens (Resolve o aviso de 320ms do Lighthouse) -->
    <link rel="dns-prefetch" href="https://wsrv.nl">

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonte Poppins Assíncrona -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,900;1,900&display=swap" media="print" onload="this.media='all'">

    <!-- GOOGLE ANALYTICS, ADS E META PIXEL LAZY LOAD (À PROVA DE LIGHTHOUSE) -->
    <script type="text/javascript">
      function loadTrackingScripts() {
        // Evita que os scripts sejam chamados múltiplas vezes
        if (window.trackingLoaded) return;
        window.trackingLoaded = true;
        
        // --- 1. Carregamento do Google Analytics e Google Ads ---
        var gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-GJVE8KGD3X';
        document.head.appendChild(gaScript);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-GJVE8KGD3X');
        
        // --- Google Ads (apenas registro da conta; o evento de conversão deve ser disparado só na página real de conversão) ---
        gtag('config', 'AW-872178533');

        // --- 2. Carregamento do Meta Pixel (Facebook) ---
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1050530354583784');
        fbq('track', 'PageView');
      }

      // Carrega os rastreadores instantaneamente assim que o usuário interagir
      ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach(function(event) {
        window.addEventListener(event, loadTrackingScripts, { once: true, passive: true });
      });

      // Failsafe: Se o usuário abrir a página e não tocar em nada, carrega após 5 segundos
      setTimeout(loadTrackingScripts, 5000);
    </script> 

    <meta name="google-site-verification" content="OMIwIqKEmMuDTLGPhd6VQuhxXifxXVaknQTbLrD5e_c" />
    <title>Nutrição com Marco</title>
  </head>

    <!-- Fallback do Meta Pixel para navegação sem JavaScript -->
    <noscript>
      <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1050530354583784&ev=PageView&noscript=1" />
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
