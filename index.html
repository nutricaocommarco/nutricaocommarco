    <!-- GOOGLE ANALYTICS LAZY LOAD (À PROVA DE LIGHTHOUSE) -->
    <script type="text/javascript">
      function loadGoogleAnalytics() {
        // Evita que o script seja chamado múltiplas vezes
        if (window.gaLoaded) return;
        window.gaLoaded = true;
        
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-GJVE8KGD3X';
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        
        gtag('config', 'G-GJVE8KGD3X');
      }

      // Carrega o Analytics instantaneamente assim que o usuário interagir
      ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach(function(event) {
        window.addEventListener(event, loadGoogleAnalytics, { once: true, passive: true });
      });

      // Failsafe: Se o usuário abrir a página e não tocar em nada, carrega após 5 segundos
      setTimeout(loadGoogleAnalytics, 5000);
    </script>
